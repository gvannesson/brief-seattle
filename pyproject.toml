[project]
name = "brief-seattle"
version = "0.1.0"
description = "Prédiction des émissions de CO2 et de la consommation d'énergie des bâtiments non résidentiels de Seattle"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]
